name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q cartoon-movie-studio.zip
          rm -rf studio/.github
          cp -r studio/. .
          rm -rf studio cartoon-movie-studio.zip
          git config user.name bot
          git config user.email bot@example.com
          git add -A
          git commit -m "Add studio"
          git push
